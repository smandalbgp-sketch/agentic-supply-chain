server:
  port: 8080
  shutdown: graceful          # finish in-flight requests when Kubernetes stops a pod

spring:
  application:
    name: agentic-supply-chain

  datasource:
    # allowPublicKeyRetrieval/useSSL=false are for local development only. Remove them in production and use TLS.
    url: ${DB_URL:jdbc:mysql://localhost:3306/supplychain?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Aps@19951986}

  jpa:
    open-in-view: false
    hibernate:
      # "update" creates/alters tables automatically: convenient for development.
      # For production, manage the schema with Flyway migrations and set this to "validate".
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: supply-chain-agents
      auto-offset-reset: earliest
    listener:
      concurrency: 3

  ai:
    openai:
      # Placeholder so the app starts without a key. Only used if agents.llm.enabled=true.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  topics:
    supplier-delay: supplier.delay.events
    decisions: agent.decisions
    partitions: ${TOPIC_PARTITIONS:3}
    replicas: ${TOPIC_REPLICAS:1}

agents:
  llm:
    # false = deterministic wording (no model call). true = Spring AI polishes summaries/emails.
    enabled: ${AGENTS_LLM_ENABLED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /actuator/health/readiness
  endpoints:
    web:
      exposure:
        include: health,info
