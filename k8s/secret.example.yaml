# TEMPLATE ONLY. Do not commit real credentials. Create the real secret with:
#
#   kubectl -n supply-chain create secret generic supply-chain-secrets \
#     --from-literal=DB_USERNAME=supplychain \
#     --from-literal=DB_PASSWORD='<your password>' \
#     --from-literal=OPENAI_API_KEY='<optional, only if AGENTS_LLM_ENABLED=true>'
#
# This file is not listed in kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: supply-chain-secrets
  namespace: supply-chain
type: Opaque
stringData:
  DB_USERNAME: "change-me"
  DB_PASSWORD: "change-me"
  OPENAI_API_KEY: "not-set"
